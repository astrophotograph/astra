name: CI

# Runs on GitHub and on the homelab forge (code-mesh, remote `code-mesh`),
# where sprinkle-runner executes it under `act` on the ci-runner VM
# (6 vCPU / 8 GiB, Ubuntu 22.04 act image) and posts the verdict as the
# `sprinkle-runner` commit status that the homeops deployer gates on.
# Forge constraints (homeops/CODE-FORGE-FOR-AGENTS.md): push events only,
# `ubuntu-latest` only, no secrets, no GitHub-hosted cache service, and the
# run logs at https://ci.bcc.sh/runs are unauthenticated on the mesh.
# setup-node runs without `cache: pnpm`: the cache service does not exist
# under act and asking for it fails the step instead of degrading (same
# lesson as nous's ci.yml, 2026-10). rust-cache is skipped there via
# `github.event.act`, which act sets and GitHub does not.
# pnpm is pinned to the major the repo is developed with (12): pnpm 9 rejects
# a settings-only pnpm-workspace.yaml ("packages field missing or empty"),
# which is what had every CI run since the workspace file was added failing.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-frontend:
    name: Frontend (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4
        with:
          version: 12

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: 22

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

  check-backend:
    name: Backend (Rust)
    needs: check-frontend
    # Forge-only. src-tauri depends on four sibling checkouts by path
    # (../../hoardfs, kith, kenning, processinator-rs); hoardfs and kith are
    # private on GitHub and CI has no credentials there, so this job had not
    # passed on GitHub since the HoardFS integration (2026-04). On code-mesh
    # all four are readable anonymously and are fetched below.
    if: ${{ github.event.act }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      # Same layout as a developer checkout under ~/code/astrophotograph/:
      # the siblings sit next to the repo, so `../../X` from src-tauri and
      # kith's own `../kenning` resolve to one copy each. Read-only clone
      # URL through the hub, no credentials (kith's ci.yml does the same).
      - name: Fetch sibling crates from the forge
        run: |
          for r in erewhon/hoardfs embettering/kith embettering/kenning astrophotograph/processinator-rs; do
            git clone --depth 1 "https://code.bcc.sh/$r" "../${r##*/}"
          done

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            python3-dev

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4
        with:
          version: 12

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: 22

      - run: pnpm install --frozen-lockfile

      - name: Build frontend (required by tauri::generate_context)
        run: pnpm run build

      # Not SHA-pinned on purpose: dtolnay moves the `stable`/`nightly` branches
      # by rewriting them, so a pinned commit soon sits on no branch. GitHub can
      # still fetch such a commit; act's git client only sees branch and tag tips
      # and fails the job with "reference not found" (run 0144 on code-mesh).
      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        if: ${{ !github.event.act }}
        with:
          workspaces: src-tauri

      - name: Cargo check
        working-directory: src-tauri
        run: cargo check

      - name: Cargo test
        working-directory: src-tauri
        run: cargo test

      - name: Cargo clippy
        working-directory: src-tauri
        run: cargo clippy -- -D warnings || true

  check-python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7

      - name: Lint with ruff
        working-directory: python
        run: |
          uv run --extra dev ruff check .
          uv run --extra dev ruff format --check .

      - name: Run tests
        working-directory: python
        run: uv run --extra dev pytest -x
