name: CI

# Runs on GitHub and on the homelab forge (code-mesh, remote `code-mesh`),
# where sprinkle-runner executes it under `act` on the ci-runner VM
# (6 vCPU / 8 GiB, Ubuntu 22.04 act image) and posts the verdict as the
# `sprinkle-runner` commit status that the homeops deployer gates on.
# Forge constraints (homeops/CODE-FORGE-FOR-AGENTS.md): push events only,
# `ubuntu-latest` only, no secrets, no GitHub-hosted cache service, and the
# run logs at https://ci.bcc.sh/runs are unauthenticated on the mesh.
# `github.event.act` is true only on the forge; the two cache steps below
# key off it because asking for the cache service under act fails the step
# instead of degrading (same lesson as nous's ci.yml, 2026-10).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-frontend:
    name: Frontend (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4
        with:
          version: 9

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: 22
          cache: ${{ github.event.act && '' || 'pnpm' }}

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

  check-backend:
    name: Backend (Rust)
    needs: check-frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            python3-dev

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4
        with:
          version: 9

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: 22
          cache: ${{ github.event.act && '' || 'pnpm' }}

      - run: pnpm install --frozen-lockfile

      - name: Build frontend (required by tauri::generate_context)
        run: pnpm run build

      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        if: ${{ !github.event.act }}
        with:
          workspaces: src-tauri

      - name: Cargo check
        working-directory: src-tauri
        run: cargo check

      - name: Cargo test
        working-directory: src-tauri
        run: cargo test

      - name: Cargo clippy
        working-directory: src-tauri
        run: cargo clippy -- -D warnings || true

  check-python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7

      - name: Lint with ruff
        working-directory: python
        run: |
          uv run --extra dev ruff check .
          uv run --extra dev ruff format --check .

      - name: Run tests
        working-directory: python
        run: uv run --extra dev pytest -x
