[package]
name = "astra-cli"
version = "2026.2.0"
description = "Upload stacked images to an Astra server from the command line, or watch a folder and upload as they appear"
authors = ["erewhon"]
license = "AGPL-3.0"
edition = "2021"
rust-version = "1.85"

[[bin]]
name = "astra-cli"
path = "src/main.rs"

[dependencies]
anyhow = "1"
blake3 = "1"
clap = { version = "4", features = ["derive", "env"] }
dirs = "6"
notify = "6"
reqwest = { version = "0.13", features = ["blocking", "json", "rustls-native-certs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
walkdir = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
